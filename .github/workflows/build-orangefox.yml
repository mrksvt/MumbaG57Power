name: Build OrangeFox Recovery - Mumba (Moto G57 Power)

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel source URL'
        required: true
        default: 'https://github.com/MotorolaMobilityLLC/kernel-msm'
      KERNEL_BRANCH:
        description: 'Kernel branch/tag'
        required: true
        default: 'MMI-W1WAAS36.48-12-16-3'
      ORANGEFOX_BRANCH:
        description: 'OrangeFox sync branch'
        required: true
        default: 'fox_12.1'
      INCLUDE_KSU:
        description: 'Patch KernelSU Next into kernel?'
        required: true
        type: boolean
        default: true
      KSU_VERSION:
        description: 'KernelSU Next version tag (e.g. v1.0.3)'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Free disk space
        run: |
          sudo apt-get remove -y "php*" "dotnet*" "mono*" "llvm*" "libllvm*" "ruby*" || true
          sudo apt-get autoremove -y
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf imagemagick lib32ncurses-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
            libssl-dev libwxgtk3.2-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3 python3-pip openjdk-17-jdk adb fastboot \
            mkbootimg \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-14-aarch64-linux-gnu gcc-14-arm-linux-gnueabi
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-14 100
          sudo update-alternatives --install /usr/bin/arm-linux-gnueabi-gcc arm-linux-gnueabi-gcc /usr/bin/arm-linux-gnueabi-gcc-14 100

      - name: Setup AOSP repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup build environment variables
        run: |
          echo "DEVICE_CODENAME=mumba" >> $GITHUB_ENV
          echo "DEVICE_MANUFACTURER=motorola" >> $GITHUB_ENV
          echo "DEVICE_MODEL=moto_g57_power" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "DEFCONFIG=gki_defconfig" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Setup ccache
        run: |
          sudo apt-get install -y ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          ccache -M 5G

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-mumba-${{ github.run_number }}
          restore-keys: |
            ccache-mumba-

      - name: Clone Clang toolchain
        run: |
          mkdir -p ~/toolchain/clang
          git clone --depth=1 \
            https://github.com/Neutron-Toolchains/clang-build-catalogue \
            ~/toolchain/clang-catalogue
          # Get latest release tarball URL
          CLANG_URL=$(curl -s https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest \
            | grep "browser_download_url.*tar.zst" | head -1 | cut -d '"' -f 4)
          if [ -z "$CLANG_URL" ]; then
            # Fallback: zyc-clang
            CLANG_URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest \
              | grep "browser_download_url.*tar.gz" | head -1 | cut -d '"' -f 4)
            curl -L "$CLANG_URL" | tar -xz -C ~/toolchain/clang --strip-components=1
          else
            curl -L "$CLANG_URL" | tar -I zstd -x -C ~/toolchain/clang --strip-components=1
          fi
          echo "CLANG_PATH=$HOME/toolchain/clang/bin" >> $GITHUB_ENV
          ~/toolchain/clang/bin/clang --version

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            --branch ${{ github.event.inputs.KERNEL_BRANCH }} \
            ${{ github.event.inputs.KERNEL_SOURCE }} \
            kernel/
          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel" >> $GITHUB_ENV

      - name: Patch KernelSU Next (optional)
        if: ${{ github.event.inputs.INCLUDE_KSU == 'true' }}
        working-directory: kernel/
        run: |
          echo "Patching KernelSU Next ${{ github.event.inputs.KSU_VERSION }}..."
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | \
            bash -s ${{ github.event.inputs.KSU_VERSION }}
          echo "KSU_VERSION_PATCHED=$(cat KernelSU-Next/version 2>/dev/null || echo unknown)" >> $GITHUB_ENV

      - name: Setup OrangeFox recovery source
        run: |
          mkdir -p $HOME/fox_build
          cd $HOME/fox_build
          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1 \
            --depth=1
          repo sync -c --no-clone-bundle --no-tags -j$(nproc)
          # Clone OrangeFox recovery source on top of TWRP
          rm -rf bootable/recovery
          git clone --depth=1 \
            -b ${{ github.event.inputs.ORANGEFOX_BRANCH }} \
            https://gitlab.com/OrangeFox/bootable/Recovery.git \
            bootable/recovery
          # Clone OrangeFox vendor
          mkdir -p vendor/recovery
          git clone --depth=1 \
            -b ${{ github.event.inputs.ORANGEFOX_BRANCH }} \
            https://gitlab.com/OrangeFox/vendor/recovery.git \
            vendor/recovery

      - name: Extract device tree from kernel DTB
        working-directory: kernel/
        run: |
          # Build minimal to extract DTB
          export PATH="$CLANG_PATH:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          
          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            ${{ env.DEFCONFIG }}
          
          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            dtbs -j$(nproc)
          
          # Copy DTB files for device tree extraction
          find out/arch/arm64/boot/dts -name "*.dtb" | head -5
          ls out/arch/arm64/boot/dts/ || true

      - name: Build kernel for recovery
        working-directory: kernel/
        run: |
          set -o pipefail
          export PATH="$CLANG_PATH:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          
          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error=default-const-init-var-unsafe -Wno-error=default-const-init-field-unsafe" \
            -j$(nproc) 2>&1 | tee ../build.log

      - name: Generate device tree for OrangeFox
        run: |
          FOX_COMMON_MK=""
          for candidate in \
            vendor/recovery/config/common.mk \
            vendor/recovery/config/fox_common.mk \
            vendor/recovery/config/twrp_common.mk; do
            if [ -f "$HOME/fox_build/$candidate" ]; then
              FOX_COMMON_MK="$candidate"
              break
            fi
          done

          if [ -z "$FOX_COMMON_MK" ]; then
            echo "WARNING: No compatible OrangeFox common makefile found; continuing without vendor/recovery/config include."
            if [ -d "$HOME/fox_build/vendor/recovery" ]; then
              find "$HOME/fox_build/vendor/recovery" -maxdepth 2 -type f -name "*.mk" | sed "s|$HOME/fox_build/||" || true
            fi
            FOX_INHERIT_LINE="# No vendor/recovery common include found"
          else
            FOX_INHERIT_LINE="\$(call inherit-product, $FOX_COMMON_MK)"
          fi

          mkdir -p ~/fox_build/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}
          
          # Basic device tree BoardConfig.mk
          cat > ~/fox_build/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}/BoardConfig.mk << 'EOF'
          DEVICE_PATH := device/motorola/mumba
          
          # Architecture
          TARGET_ARCH := arm64
          TARGET_ARCH_VARIANT := armv8-a
          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_ABI2 :=
          TARGET_CPU_VARIANT := cortex-a55
          
          # Bootloader
          TARGET_BOOTLOADER_BOARD_NAME := parrot
          TARGET_NO_BOOTLOADER := true
          
          # Kernel
          BOARD_KERNEL_CMDLINE := \
            console=ttyMSM0,115200n8 \
            androidboot.hardware=qcom \
            androidboot.console=ttyMSM0 \
            androidboot.memcg=1 \
            lpm_levels.sleep_disabled=1 \
            msm_rtb.filter=0x237 \
            service_locator.enable=1 \
            androidboot.usbcontroller=a600000.dwc3 \
            swiotlb=0 \
            loop.max_part=7 \
            cgroup.memory=nokmem,nosocket \
            pcie_ports=compat \
            iptable_raw.raw_before_defrag=1 \
            ip6table_raw.raw6_before_defrag=1
          
          BOARD_KERNEL_BASE := 0x00000000
          BOARD_KERNEL_PAGESIZE := 4096
          BOARD_KERNEL_IMAGE_NAME := Image
          
          TARGET_PREBUILT_KERNEL := $(DEVICE_PATH)/prebuilt/Image
          BOARD_PREBUILT_DTBIMAGE_DIR := $(DEVICE_PATH)/prebuilt/dtbs
          BOARD_PREBUILT_DTBOIMAGE := $(DEVICE_PATH)/prebuilt/dtbo.img
          
          # Partitions
          BOARD_BOOTIMAGE_PARTITION_SIZE := 100663296
          BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE := 100663296
          BOARD_HAS_LARGE_FILESYSTEM := true
          BOARD_SYSTEMIMAGE_PARTITION_TYPE := ext4
          BOARD_USERDATAIMAGE_FILE_SYSTEM_TYPE := f2fs
          BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE := ext4
          
          # Recovery
          TARGET_RECOVERY_PIXEL_FORMAT := RGBX_8888
          TARGET_USERIMAGES_USE_EXT4 := true
          TARGET_USERIMAGES_USE_F2FS := true
          
          # A/B
          AB_OTA_UPDATER := true
          AB_OTA_PARTITIONS += \
            boot \
            dtbo \
            product \
            system \
            system_ext \
            vbmeta \
            vbmeta_system \
            vendor \
            vendor_boot
          
          # Android Verified Boot
          BOARD_AVB_ENABLE := true
          BOARD_AVB_MAKE_VBMETA_IMAGE_ARGS += --flags 3
          
          # Platform
          TARGET_BOARD_PLATFORM := parrot
          
          # OrangeFox flags
          OF_MAINTAINER := ndeso17
          OF_DEVICE_CODE := mumba
          OF_TARGET_DEVICES := mumba
          FOX_BUILD_DEVICE := mumba
          OF_SCREEN_H := 2400
          OF_SCREEN_W := 1080
          OF_STATUS_H := 100
          OF_STATUS_INDENT_LEFT := 48
          OF_STATUS_INDENT_RIGHT := 48
          OF_ALLOW_DISABLE_NAVBAR := 1
          OF_AB_DEVICE := 1
          OF_USE_GREEN_LED := 0
          FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER := 1
          FOX_RECOVERY_INSTALL_PARTITION := /dev/block/bootdevice/by-name/recovery
          EOF
          
          # AndroidProducts.mk
          cat > ~/fox_build/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}/AndroidProducts.mk << 'EOF'
          PRODUCT_MAKEFILES := \
            $(LOCAL_DIR)/omni_mumba.mk
          
          COMMON_LUNCH_CHOICES := \
            omni_mumba-eng \
            omni_mumba-userdebug
          EOF
          
          # omni_mumba.mk
          cat > ~/fox_build/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}/omni_mumba.mk << 'EOF'
          # Inherit from AOSP
          $(call inherit-product, $(SRC_TARGET_DIR)/product/base.mk)
          
          # Inherit OrangeFox
          __FOX_INHERIT_LINE__
          
          PRODUCT_DEVICE := mumba
          PRODUCT_NAME := omni_mumba
          PRODUCT_BRAND := motorola
          PRODUCT_MODEL := moto g57 power
          PRODUCT_MANUFACTURER := motorola
          EOF
          sed -i "s|__FOX_INHERIT_LINE__|$FOX_INHERIT_LINE|" \
            ~/fox_build/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}/omni_mumba.mk
          
          echo "Device tree generated at ~/fox_build/device/motorola/mumba"

      - name: Copy prebuilt kernel to device tree
        run: |
          mkdir -p ~/fox_build/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}/prebuilt/dtbs
          
          # Copy kernel Image
          cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image \
            ~/fox_build/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}/prebuilt/Image
          
          # Copy DTB files
          find $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dts \
            -name "*.dtb" \
            -exec cp {} ~/fox_build/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}/prebuilt/dtbs/ \;
          
          DTBO_DIR=$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dts
          DTBO_FILES=$(find "$DTBO_DIR" -name "*.dtb" | sort)
          if [ -n "$DTBO_FILES" ]; then
            # Use mkdtimg to create dtbo.img
            pip3 install mkdtimg 2>/dev/null || true
            # Fallback: use dtbtool or cat DTBs into raw dtbo.img
            if command -v mkdtimg &>/dev/null; then
              mkdtimg create \
                ~/fox_build/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}/prebuilt/dtbo.img \
                $DTBO_FILES
            else
              # Simple concatenation fallback
              cat $DTBO_FILES > ~/fox_build/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}/prebuilt/dtbo.img
            fi
            echo "dtbo.img created"
          else
            echo "WARNING: No DTB files found for dtbo.img"
          fi
          
          echo "Prebuilt kernel files copied."

      - name: Build boot.img with new kernel
        run: |
          KERNEL_IMAGE=$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image
          OUT_BOOT=$GITHUB_WORKSPACE/output/boot.img
          mkdir -p $GITHUB_WORKSPACE/output
          mkbootimg \
            --header_version 4 \
            --kernel "$KERNEL_IMAGE" \
            --output "$OUT_BOOT"
          echo "BOOT_IMG=$OUT_BOOT" >> $GITHUB_ENV
          ls -lh "$OUT_BOOT"

      - name: Build OrangeFox Recovery
        env:
          FOX_BUILD_DEVICE: mumba
          OF_MAINTAINER: ndeso17
        run: |
          set -o pipefail
          cd "$HOME/fox_build"
          source build/envsetup.sh
          lunch omni_mumba-eng
          mka recoveryimage -j$(nproc) 2>&1 | tee $GITHUB_WORKSPACE/recovery_build.log

      - name: Package artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          
          # Recovery image
          cp ~/fox_build/out/target/product/mumba/OrangeFox*.img \
            $GITHUB_WORKSPACE/output/ 2>/dev/null || \
          cp ~/fox_build/out/target/product/mumba/recovery.img \
            $GITHUB_WORKSPACE/output/OrangeFox-mumba-${{ env.BUILD_DATE }}.img 2>/dev/null || \
          echo "WARNING: recovery.img not found, check build log"
          
          # Recovery zip (if generated)
          cp ~/fox_build/out/target/product/mumba/OrangeFox*.zip \
            $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          
          # boot.img with new KernelSU-patched kernel
          cp $GITHUB_WORKSPACE/output/boot.img \
            $GITHUB_WORKSPACE/output/boot-ksu-mumba-${{ env.BUILD_DATE }}.img 2>/dev/null || \
          echo "WARNING: boot.img not found"
          
          ls -lh $GITHUB_WORKSPACE/output/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.BUILD_DATE }}
          path: |
            build.log
            recovery_build.log
          retention-days: 7

      - name: Upload OrangeFox Recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-mumba-${{ env.BUILD_DATE }}
          path: output/
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OrangeFox-mumba-${{ env.BUILD_DATE }}
          name: OrangeFox Recovery - Moto G57 Power (${{ env.BUILD_DATE }})
          body: |
            ## OrangeFox Recovery for Moto G57 Power (mumba)
            
            **Build Info:**
            - Device: Moto G57 Power (mumba)
            - Kernel Source: `${{ github.event.inputs.KERNEL_BRANCH }}`
            - KernelSU Next: ${{ github.event.inputs.INCLUDE_KSU == 'true' && 'Included' || 'Not included' }}
            - Build Date: ${{ env.BUILD_DATE }}
            
            **Flash Instructions:**
            ```
            fastboot flash recovery OrangeFox-mumba-*.img
            fastboot flash boot boot-ksu-mumba-*.img
            fastboot reboot recovery
            ```
            
            > ⚠️ Bootloader must be unlocked before flashing.
          files: output/*
          draft: false
          prerelease: true
